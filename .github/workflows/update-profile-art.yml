name: Update animated profile
on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate.py'
      - '.github/workflows/update-profile-art.yml'
permissions:
  contents: write
concurrency:
  group: profile-art
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate artwork from real contributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/generate.py --fetch
      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/info-card.svg assets/contributions.svg data/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile art [skip ci]'
            git push
          fi
