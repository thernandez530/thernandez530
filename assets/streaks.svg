<svg xmlns="http://www.w3.org/2000/svg" width="860" height="213" viewBox="0 0 860 213" role="img"><title>Contribuciones y rachas reales de GitHub</title><defs><linearGradient id="surface" x2="1" y2="1"><stop stop-color="#080d23"/><stop offset="1" stop-color="#141d42"/></linearGradient></defs><style>text{font-family:Consolas,"Liberation Mono",monospace}text{animation:readout 16s ease infinite}.boot{animation:boot 16s ease infinite}.grow-y{transform-box:fill-box;transform-origin:center bottom;animation:grow-y 16s ease infinite}.grow-x{transform-box:fill-box;transform-origin:left center;animation:grow-x 16s ease infinite}.ring{animation:ring 16s ease infinite}.pulse{animation:pulse 4s ease-in-out infinite}@keyframes readout{0%{opacity:.25}8%,100%{opacity:1}}@keyframes boot{0%{opacity:.2;transform:translateY(4px)}10%,100%{opacity:1;transform:translateY(0)}}@keyframes grow-y{0%{transform:scaleY(.02)}14%,100%{transform:scaleY(1)}}@keyframes grow-x{0%{transform:scaleX(.01)}14%,100%{transform:scaleX(1)}}@keyframes ring{0%{stroke-dashoffset:321}15%,100%{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}@media(prefers-reduced-motion:reduce){text,.boot,.grow-y,.grow-x,.ring,.pulse{animation:none}}</style><rect x="1" y="1" width="858" height="211" rx="12" fill="url(#surface)" stroke="#67e8f9" stroke-opacity=".65"/><text x="26" y="30" fill="#67e8f9" font-size="12">STREAK.MONITOR</text><circle cx="154" cy="109" r="51" fill="none" stroke="#243352" stroke-width="7"/><circle cx="154" cy="109" r="51" fill="none" class="ring" style="animation-delay:0.00s" stroke="#a78bfa" stroke-width="7" stroke-dasharray="280 41" transform="rotate(-90 154 109)"/><text x="154" y="119" text-anchor="middle" fill="#f1f5f9" font-size="32">565</text><text x="154" y="187" text-anchor="middle" fill="#94a3b8" font-size="12">Contribuciones / 12 meses</text><circle cx="430" cy="109" r="51" fill="none" stroke="#243352" stroke-width="7"/><circle cx="430" cy="109" r="51" fill="none" class="ri