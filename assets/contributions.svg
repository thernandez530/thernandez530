<svg xmlns="http://www.w3.org/2000/svg" width="860" height="165" viewBox="0 0 860 165" role="img" aria-label="Calendario de contribuciones de GitHub"><title>Calendario de contribuciones de GitHub</title><style>text{font-family:ui-monospace,Consolas,monospace}.reveal{animation:reveal .6s ease both}@keyframes reveal{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.reveal{animation:none}}</style><rect width="860" height="165" rx="16" fill="#0d1117"/><rect x=".5" y=".5" width="859" height="164" rx="16" fill="none" stroke="#30363d"/><text class="reveal" style="animation-delay:0s" x="32" y="36" fill="#3fb950" font-size="16">tomas@github ~ $ contributions</text><text class="reveal" style="animation-delay:0s" x="32" y="88" fill="#c9d1d9" font-size="18">Calendario conectado a GitHub Actions.</text><text class="reveal" style="animation-delay:0s" x="32" y="123" fill="#8b949e" font-size="15">Los datos reales aparecerán tras la primera ejecución.</text></svg>