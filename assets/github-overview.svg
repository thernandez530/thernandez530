<svg xmlns="http://www.w3.org/2000/svg" width="860" height="337" viewBox="0 0 860 337" role="img"><title>Estadísticas de GitHub y distribución de lenguajes en repositorios públicos</title><defs><linearGradient id="surface" x2="1" y2="1"><stop stop-color="#080d23"/><stop offset="1" stop-color="#141d42"/></linearGradient></defs><style>text{font-family:Consolas,"Liberation Mono",monospace}text{animation:readout 16s ease infinite}.boot{animation:boot 16s ease infinite}.grow-y{transform-box:fill-box;transform-origin:center bottom;animation:grow-y 16s ease infinite}.grow-x{transform-box:fill-box;transform-origin:left center;animation:grow-x 16s ease infinite}.ring{animation:ring 16s ease infinite}.pulse{animation:pulse 4s ease-in-out infinite}@keyframes readout{0%{opacity:.25}8%,100%{opacity:1}}@keyframes boot{0%{opacity:.2;transform:translateY(4px)}10%,100%{opacity:1;transform:translateY(0)}}@keyframes grow-y{0%{transform:scaleY(.02)}14%,100%{transform:scaleY(1)}}@keyframes grow-x{0%{transform:scaleX(.01)}14%,100%{transform:scaleX(1)}}@keyframes ring{0%{stroke-dashoffset:321}15%,100%{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}@media(prefers-reduced-motion:reduce){text,.boot,.grow-y,.grow-x,.ring,.pulse{animation:none}}</style><rect x="1" y="1" width="858" height="335" rx="12" fill="url(#surface)" stroke="#67e8f9" stroke-opacity=".65"/><text x="26" y="30" fill="#67e8f9" font-size="12">GITHUB.STATS</text><text x="449" y="30" fill="#67e8f9" font-size="12">MOST USED LANGUAGES</text><line x1="421" y1="52" x2="421" y2="282" stroke="#29445f"/><g class="boot" style="animation-delay:0.00s"><text x="26" y="72" fill="#cbd5e1" font-size="12">Estrellas / repos públicos</text><text x="367" y="72" fill="#d8b4fe" font-size="16">0</text></g><g class="boot" style="animation-delay:0.12s"><text x="26" y="107" fill="#cbd5e1" font-size="12">Commits / últimos 12 meses</text><text x="367" y="107" fill="#d8b4fe" font-size="16">31</text></g><g class="boot" style="anim