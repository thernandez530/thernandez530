<svg xmlns="http://www.w3.org/2000/svg" width="860" height="54" viewBox="0 0 860 54" role="img"><title>TECH.STACK</title><defs><linearGradient id="surface" x2="1" y2="1"><stop stop-color="#080d23"/><stop offset="1" stop-color="#141d42"/></linearGradient></defs><style>text{font-family:Consolas,"Liberation Mono",monospace}text{animation:readout 16s ease infinite}.boot{animation:boot 16s ease infinite}.grow-y{transform-box:fill-box;transform-origin:center bottom;animation:grow-y 16s ease infinite}.grow-x{transform-box:fill-box;transform-origin:left center;animation:grow-x 16s ease infinite}.ring{animation:ring 16s ease infinite}.pulse{animation:pulse 4s ease-in-out infinite}@keyframes readout{0%{opacity:.25}8%,100%{opacity:1}}@keyframes boot{0%{opacity:.2;transform:translateY(4px)}10%,100%{opacity:1;transform:translateY(0)}}@keyframes grow-y{0%{transform:scaleY(.02)}14%,100%{transform:scaleY(1)}}@keyframes grow-x{0%{transform:scaleX(.01)}14%,100%{transform:scaleX(1)}}@keyframes ring{0%{stroke-dashoffset:321}15%,100%{stroke-dashoffset:0}}@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}@media(prefers-reduced-motion:reduce){text,.boot,.grow-y,.grow-x,.ring,.pulse{animation:none}}</style><rect x="1" y="1" width="858" height="52" rx="12" fill="url(#surface)" stroke="#67e8f9" stroke-opacity=".65"/><text x="24" y="34" fill="#67e8f9" font-size="16">TECH.STACK</text><rect class="pulse" x="824" y="19" width="10" height="18" rx="2" fill="#a78bfa"/></svg>